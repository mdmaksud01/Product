
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Product</title>
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

 <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">E-Commerce</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Add Product</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/all}">Products</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
  <div class="container">
    <h2 class="mt-5">Edit Product</h2>
    <form th:action="@{/save}" method="post" th:object="${data}">
      <div class="mb-3">
      
      <input type="hidden" th:field="*{id}">
        <label for="name" class="form-label">Product Name</label> <input
          type="text" class="form-control" id="name" name="name" required th:field="*{name}">
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label> <input
          type="text" class="form-control" id="description"
          name="description" required th:field="*{description}">
      </div>
      <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label> <input
          type="number" class="form-control" id="quantity" name="quantity"
          required th:field="*{quantity}">
      </div>
      <div class="mb-3">
        <label for="price" class="form-label">Price</label> <input
          type="number" class="form-control" id="price" name="price" required th:field="*{price}">
      </div>
      <button class="btn btn-primary" type="submit">Save</button>
    </form>
  </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
